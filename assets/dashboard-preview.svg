<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity=".05"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}.i{fill:#1d1d1f}.m{fill:#6e6e73}.b{fill:#0071e3}.l{font-size:11px;font-weight:700;letter-spacing:1px;fill:#86868b}.v{font-size:24px;font-weight:650;letter-spacing:-.8px;fill:#1d1d1f}.card{fill:#f5f5f7;stroke:#e8e8ed}.sec{font-size:20px;font-weight:650;letter-spacing:-.5px;fill:#1d1d1f}</style></defs><rect width="1200" height="660" rx="28" fill="#fff"/><text x="50" y="50" class="b" font-size="12" font-weight="700" letter-spacing="1.6">CYBERSECURITY ANALYTICS &amp; AI</text><text x="50" y="94" class="i" font-size="36" font-weight="650" letter-spacing="-1.5">From telemetry to evidence to a better security decision.</text><text x="50" y="123" class="m" font-size="14">Defensive analytics, interpretable ML, graph reasoning, AI safety, OSINT, and purple-team validation across synthetic labs.</text><rect x="934" y="45" width="216" height="36" rx="18" fill="#f5f5f7"/><circle cx="954" cy="63" r="5" fill="#34c759"/><text x="968" y="67" class="i" font-size="11" font-weight="650">Portfolio surfaces ready</text><g filter="url(#s)"><rect class="card" x="50" y="158" width="255" height="100" rx="24"/><rect class="card" x="320" y="158" width="255" height="100" rx="24"/><rect class="card" x="590" y="158" width="255" height="100" rx="24"/><rect class="card" x="860" y="158" width="290" height="100" rx="24"/></g><text x="72" y="188" class="l">ANALYTICS</text><text x="72" y="228" class="v">Defensive</text><text x="342" y="188" class="l">ML STYLE</text><text x="342" y="228" class="v">Interpretable</text><text x="612" y="188" class="l">DATA</text><text x="612" y="228" class="v">Offline / Synthetic</text><text x="882" y="188" class="l">DECISION</text><text x="882" y="228" class="v">Human-reviewed</text><rect x="50" y="290" width="525" height="298" rx="28" class="card"/><text x="76" y="328" class="sec">Portfolio surfaces</text><text x="76" y="352" class="m" font-size="13">Notebook labs plus standalone flagship systems.</text><circle cx="82" cy="398" r="5" fill="#0071e3"/><text x="100" y="403" class="i" font-size="13">Identity · DNS · endpoint · SIEM · cloud IAM</text><circle cx="82" cy="443" r="5" fill="#0071e3" opacity=".82"/><text x="100" y="448" class="i" font-size="13">Classification · clustering · anomaly · graph ML</text><circle cx="82" cy="488" r="5" fill="#0071e3" opacity=".64"/><text x="100" y="493" class="i" font-size="13">Threat intelligence · ethical OSINT · evidence fusion</text><circle cx="82" cy="533" r="5" fill="#0071e3" opacity=".46"/><text x="100" y="538" class="i" font-size="13">Red / blue / purple validation · LLM safety · macOS</text><rect x="595" y="290" width="555" height="298" rx="28" class="card"/><text x="621" y="328" class="sec">Consistent notebook workflow</text><text x="621" y="352" class="m" font-size="13">Assumptions, visuals, checks, and limits stay explicit.</text><rect x="621" y="390" width="490" height="42" rx="14" fill="#fff" stroke="#d2d2d7"/><text x="642" y="416" class="i" font-size="12" font-weight="650">1 · Synthetic data → inspectable baseline</text><rect x="621" y="446" width="490" height="42" rx="14" fill="#fff" stroke="#d2d2d7"/><text x="642" y="472" class="i" font-size="12" font-weight="650">2 · Visual story → stronger ML / graph method</text><rect x="621" y="502" width="490" height="42" rx="14" fill="#fff" stroke="#d2d2d7"/><text x="642" y="528" class="i" font-size="12" font-weight="650">3 · Explainability → executable validation → production boundary</text><text x="50" y="625" class="m" font-size="11">Synthetic/offline demonstrations only · not production efficacy claims</text></svg>