<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Cybersecurity Analytics and AI dashboard preview</title><desc id="desc">Static synthetic portfolio dashboard preview spanning defensive analytics, interpretable machine learning, graph analytics, AI safety, ethical OSINT, purple-team validation, macOS security, and attack-path analysis.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14283a"/></linearGradient></defs><rect width="1200" height="660" rx="24" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="30" font-weight="800" fill="#f8fafc">Cybersecurity Analytics &amp; AI</text><text x="48" y="87" font-size="13" font-weight="700" letter-spacing="1.4" fill="#67e8f9">DETECTION · ML · GRAPH · AI SAFETY · OSINT · PURPLE TEAM</text><text x="1148" y="63" text-anchor="end" font-size="12" font-weight="700" fill="#94a3b8">STATIC / SYNTHETIC PORTFOLIO PREVIEW</text><rect x="48" y="118" width="255" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="68" y="147" font-size="11" font-weight="700" fill="#94a3b8">ANALYTICS</text><text x="68" y="184" font-size="24" font-weight="800" fill="#f8fafc">DEFENSIVE</text><rect x="323" y="118" width="255" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="343" y="147" font-size="11" font-weight="700" fill="#94a3b8">ML STYLE</text><text x="343" y="184" font-size="24" font-weight="800" fill="#93c5fd">INTERPRETABLE</text><rect x="598" y="118" width="255" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="618" y="147" font-size="11" font-weight="700" fill="#94a3b8">DATA</text><text x="618" y="184" font-size="24" font-weight="800" fill="#4ade80">OFFLINE / SYNTHETIC</text><rect x="873" y="118" width="279" height="92" rx="15" fill="#0f1d2e" stroke="#29425b"/><text x="893" y="147" font-size="11" font-weight="700" fill="#94a3b8">DECISION</text><text x="893" y="184" font-size="24" font-weight="800" fill="#fbbf24">HUMAN-REVIEWED</text><rect x="48" y="236" width="535" height="326" rx="18" fill="#0b1727" stroke="#29425b"/><text x="72" y="272" font-size="18" font-weight="800" fill="#f8fafc">Portfolio surfaces</text><text x="72" y="298" font-size="12" fill="#94a3b8">Notebook labs plus standalone flagship systems</text><circle cx="78" cy="343" r="6" fill="#60a5fa"/><text x="96" y="348" font-size="14" font-weight="650" fill="#dbeafe">Identity · DNS · endpoint · SIEM · cloud IAM</text><circle cx="78" cy="391" r="6" fill="#a78bfa"/><text x="96" y="396" font-size="14" font-weight="650" fill="#dbeafe">Classification · clustering · anomaly · graph ML</text><circle cx="78" cy="439" r="6" fill="#5eead4"/><text x="96" y="444" font-size="14" font-weight="650" fill="#dbeafe">Threat intelligence · ethical OSINT · evidence fusion</text><circle cx="78" cy="487" r="6" fill="#f59e0b"/><text x="96" y="492" font-size="14" font-weight="650" fill="#dbeafe">Red / blue / purple validation under guardrails</text><circle cx="78" cy="535" r="6" fill="#f472b6"/><text x="96" y="540" font-size="14" font-weight="650" fill="#dbeafe">LLM safety · macOS security · agentic attack paths</text><rect x="607" y="236" width="545" height="326" rx="18" fill="#0b1727" stroke="#29425b"/><text x="631" y="272" font-size="18" font-weight="800" fill="#f8fafc">Consistent notebook workflow</text><text x="631" y="298" font-size="12" fill="#94a3b8">Every project exposes assumptions, visuals, checks, and limits</text><rect x="631" y="330" width="472" height="42" rx="10" fill="#15243a" stroke="#1d4ed8"/><text x="651" y="357" font-size="13" font-weight="800" fill="#93c5fd">1 · SYNTHETIC DATA → INSPECTABLE BASELINE</text><rect x="631" y="386" width="472" height="42" rx="10" fill="#211c38" stroke="#6d28d9"/><text x="651" y="413" font-size="13" font-weight="800" fill="#c4b5fd">2 · VISUAL STORY → STRONGER ML / GRAPH METHOD</text><rect x=