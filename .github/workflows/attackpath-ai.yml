name: AttackPath AI

on:
  push:
    branches: [main]
    paths:
      - "attackpath-ai/**"
      - ".github/workflows/attackpath-ai.yml"
  pull_request:
    paths:
      - "attackpath-ai/**"
      - ".github/workflows/attackpath-ai.yml"

permissions:
  contents: read

jobs:
  defensive-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dashboard dependency
        run: python -m pip install "streamlit>=1.37"
      - name: Run unit tests
        run: python -m unittest discover -s attackpath-ai/tests -v
      - name: Rebuild executed notebook and evidence
        run: python attackpath-ai/build_notebook.py
      - name: Validate notebook, visuals, data, and release gates
        run: python attackpath-ai/validate_project.py
      - name: Validate CLI
        run: python -m attackpath_ai.cli self-test
        working-directory: attackpath-ai
      - name: Smoke-test Streamlit dashboard
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("attackpath-ai/app.py")
          app.run(timeout=20)
          assert not app.exception, app.exception
          assert len(app.metric) == 5
          assert len(app.tabs) == 4
          print("PASS: Streamlit default state rendered with five metrics and four tabs")
          PY
