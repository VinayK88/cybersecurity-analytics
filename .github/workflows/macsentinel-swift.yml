name: MacSentinel Swift Sensor

on:
  push:
    branches: [main]
    paths:
      - "macsentinel/sensor-swift/**"
      - "macsentinel/data/synthetic_macos_events.csv"
      - ".github/workflows/macsentinel-swift.yml"
  pull_request:
    paths:
      - "macsentinel/sensor-swift/**"
      - "macsentinel/data/synthetic_macos_events.csv"
      - ".github/workflows/macsentinel-swift.yml"

permissions:
  contents: read

jobs:
  test-and-benchmark:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Report Swift toolchain
        run: swift --version
      - name: Compile and test native sensor
        run: swift test --package-path macsentinel/sensor-swift --configuration release
      - name: Replay complete fixture with privacy and drop gates
        run: |
          swift run --package-path macsentinel/sensor-swift --configuration release \
            macsentinel-sensor benchmark \
            --input macsentinel/data/synthetic_macos_events.csv \
            --capacity 256 \
            --batch-size 64 \
            --report macsentinel/sensor-swift/benchmarks/ci-report.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: macsentinel-native-sensor-benchmark
          path: macsentinel/sensor-swift/benchmarks/ci-report.json
